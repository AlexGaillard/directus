name: CLA Assistant

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - id: check
        uses: directus/cla-bot@v0.0.3
        continue-on-error: true

      - name: Create missing CLA handoff
        # TESTING: forced true, restore to `steps.check.outcome == 'failure' && steps.check.outputs.missing`
        if: always()
        env:
          MISSING: ${{ steps.check.outputs.missing }}
          # TESTING: stand-in mentions so the comment renders when the bot found nothing
          MISSING_FALLBACK: '@cla-test-user'
        run: |
          mkdir -p cla-missing
          printf '%s' "${MISSING:-$MISSING_FALLBACK}" > cla-missing/missing

      - name: Upload missing CLA handoff
        # TESTING: forced true, restore to `steps.check.outcome == 'failure' && steps.check.outputs.missing`
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cla-missing
          path: cla-missing
          if-no-files-found: error
          retention-days: 1

      - name: Preserve CLA result
        # TESTING: forced true, restore to `steps.check.outcome == 'failure'`
        if: always()
        run: exit 1
